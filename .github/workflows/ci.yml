name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    name: test (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Smoke test (offline inventory)
        run: |
          go build -o aws-backup-coverage .
          ./aws-backup-coverage check --from-file examples/inventory.json
          ./aws-backup-coverage check --from-file examples/inventory.json -o sarif > /tmp/out.sarif
          test -s /tmp/out.sarif

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Smoke test (offline inventory)
        run: |
          go build -o aws-backup-coverage .
          ./aws-backup-coverage check --from-file examples/inventory.json
          ./aws-backup-coverage check --from-file examples/inventory.json -o sarif > /tmp/out.sarif
          test -s /tmp/out.sarif
